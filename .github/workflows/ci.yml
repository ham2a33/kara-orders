name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kara_orders_test
          POSTGRES_USER: kara
          POSTGRES_PASSWORD: kara_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kara -d kara_orders_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://kara:kara_password@localhost:5432/kara_orders_test
      SECRET_KEY: ci-secret-key-ci-secret-key-ci-secret-key
      ENVIRONMENT: development
      RATE_LIMIT_ENABLED: "false"
      SUPABASE_URL: ""
      SUPABASE_SERVICE_ROLE_KEY: ""
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Format check
        run: black --check .
      - name: Type check
        run: mypy app
      - name: Apply migrations
        run: alembic upgrade head
      - name: Unit and integration tests
        run: pytest
      - name: Docker build
        run: docker build -t kara-orders-backend:ci .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Docker build
        run: docker build -t kara-orders-frontend:ci .
